  repo: https://github.com/lixiaowanggit/halo-theme-hingle2.0.git
  settingName: "theme-Hingle-setting"
  configMapName: "theme-Hingle-configMap"
  version: 2.2.0
  requires: 2.0.0
  customTemplates:
    category:
      - name: 书影分类模板
        description: 书影等需要展示封面的分类展示
        screenshot:
        file: ./custom_pages/movie.html