apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: halo-theme-hingle2.0
spec:
  displayName: Hingle2.0
  author:
    name: Dujing
    website: https://blog.dujing.space
  description: 基于halo-theme-hingle2.0的魔改主题
  logo: http://cdn.sep.cc/avatar/e2d1f9c5da125994d7bf02c691e3124a?s=256&d=identicon
