<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
    th:replace="~{modules/layout :: html(title = '相册' +  ${site.title}, content = ~{::content})}">


<th:block th:fragment="content">
    <main>
        <div class="wrap min">
            <section class="home-title">
                <h1>"杂记相册"</h1>
            </section>

            <section class="post-content">
                <!-- 使用 photoFinder API 获取数据 -->
                <th:block th:each="group : ${photoFinder.groupBy()}">
                    <h2 class="photos-team" th:text="${group.spec.displayName}"></h2>
                    <div class="gallery-photos page">
                        <div class="gallery-photo visible" th:each="photo : ${group.photos}" >
                            <img class="photo-img" loading="lazy" decoding="async" th:src="${photo.spec.url}" th:alt="${photo.spec.displayName}">
                        </div>
                    </div>
                </th:block>
            </section>

            <script th:src="@{/assets/lib/ViewImage/view-image.min.js}"></script>
            <script>
                // 初始化图片查看器
                window.ViewImage && ViewImage.init('.gallery-photo img');
                
                // 处理图片加载错误
                document.querySelectorAll('.photo-img').forEach(img => {
                    img.addEventListener('error', function() {
                        this.src = '@{/assets/images/photo_loading.gif}';
                    });
                });
            </script>

        </div>

    </main>
</th:block>

</html>
