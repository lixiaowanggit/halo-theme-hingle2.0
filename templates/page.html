<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org"
    th:replace="~{modules/layout :: html(title = ${singlePage.spec.title} + '-' + ${site.title}, content = ~{::content}, template = 'post')}">

<th:block th:fragment="content">
    <main>
        <div class="wrap min">
            <section class="home-title text-center">
                <h1 th:text="${singlePage.spec.title}"></h1>
                <div class="post-meta">
                    <time class="date" th:text="${#dates.format(singlePage.spec.publishTime, 'yyyy.MM.dd')}"></time>


                    <span class="view" th:text="${singlePage.stats.visit}"></span>

                </div>
            </section>

            <section>
                <article class="post-content" th:utext="${singlePage.content.content}"></article>
            </section>

            <!-- 需要判断当前评论组件是否满足显示的条件，这个变量可能是是否安装评论插件、文章是否开启评论等条件的组合 -->
            <div id="halo-comment" th:if="${haloCommentEnabled}">

                <!-- <script>
                    var onli;
                    if (document.cookie.indexOf("night") !== -1) {
                        if (document.cookie.indexOf("night=true") !== -1) {
                            onli = 'dark';
                        }
                    } else {
                        onli = 'light'
                    }
                </script> -->
                <halo:comment group="content.halo.run" kind="SinglePage" th:attr="name=${singlePage.metadata.name}" />
                <!-- colorScheme="onli" /> -->
            </div>

        </div>
    </main>


</th:block>

</html>
